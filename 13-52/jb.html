<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>13.02 - 13.52 PS4 Jelbrek</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }

      #cat-fullscreen-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        z-index: 999999;
        justify-content: center;
        align-items: center;
      }

      #cat-fullscreen-overlay img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img
        src="../logo_raw.png"
        alt=""
        width="28"
        height="28"
      /><b>PS4 jelbrek 13.00-13.52</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <div id="cat-fullscreen-overlay">
      <img id="cat-random-img" src="" alt="result">
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
